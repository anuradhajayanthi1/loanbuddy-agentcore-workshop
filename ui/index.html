<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoanBuddy — First Bank of Workshopia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ======================= Login panel ======================= -->
<div id="login-panel" class="center-panel">
  <div class="card">
    <h1>LoanBuddy</h1>
    <p class="sub">First Bank of Workshopia &mdash; Personal Loans</p>
    <p class="badge" id="login-badge"></p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login-btn">Sign in</button>
    <p id="login-error" class="error" hidden></p>
    <p class="hint">Workshop users: <code>alice</code> / <code>bob</code>
      (password on your workshop card)</p>
  </div>
</div>

<!-- ======================= Chat panel ======================= -->
<div id="chat-panel" hidden>
  <header>
    <div>
      <strong>LoanBuddy</strong>
      <span class="sub">Personal loan application</span>
      <span class="badge" id="header-badge"></span>
    </div>
    <div class="header-right">
      <span id="status-chip" class="chip">&mdash;</span>
      <span id="who" class="sub"></span>
      <button id="logout-btn" class="ghost">Sign out</button>
    </div>
  </header>

  <main id="messages" aria-live="polite"></main>

  <!-- Upload strip appears when the agent provides an upload link -->
  <div id="upload-strip" hidden>
    <span id="upload-label"></span>
    <input type="file" id="file-input" accept="image/png,image/jpeg,application/pdf">
    <button id="upload-btn">Upload</button>
    <button id="upload-cancel" class="ghost">Dismiss</button>
    <span id="upload-progress" class="sub"></span>
  </div>

  <footer>
    <textarea id="prompt" rows="1"
      placeholder="Message LoanBuddy&hellip;  (Enter to send)"></textarea>
    <button id="send-btn">Send</button>
  </footer>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
