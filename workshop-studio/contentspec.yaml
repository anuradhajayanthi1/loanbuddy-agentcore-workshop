version: 2.0

defaultLocaleCode: en-US
localeCodes:
  - en-US

# This is a self-paced, bring-your-own-account workshop. Attendees clone the
# repo and run scripts/bootstrap.sh, which deploys the CloudFormation stack
# and seeds the environment. (Auto-provisioning into vended event accounts is
# a future enhancement pending Workshop Studio asset tooling.)

awsAccountConfig:
  accountSources:
    - workshop_studio
    - customer_provided
  participantRole:
    # Scoped to the services this workshop actually uses. IAM write access is
    # restricted to the workshop's role name prefixes (the CFN stack's agent
    # roles and the roles the agentcore starter toolkit creates for
    # CodeBuild/Gateway). See static/participant-policy.json.
    iamPolicies:
      - static/participant-policy.json
    managedPolicies:
      - arn:aws:iam::aws:policy/ReadOnlyAccess
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 1
    accessibleRegions:
      required:
        - us-east-1
    deployableRegions:
      required:
        - us-east-1
